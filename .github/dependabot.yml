version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  # - package-ecosystem: "gitsubmodule"
  #   directory: "/"
  #   schedule:
  #     interval: "monthly"

  - package-ecosystem: "pip"
    directories:
      - "/"
      - ".github/workflows/requirements"
    schedule:
      interval: "monthly"
    # The default raises the ``.in`` floors even when they already allow the new pin.
    versioning-strategy: "increase-if-necessary"
    groups:
      pip:
        patterns:
          - "*"
