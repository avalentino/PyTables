[workspace]
authors = ["Antonio Valentino <antonio.valentino@tiscali.it>"]
channels = ["conda-forge"]
name = "PyTables"
platforms = ["linux-64", "osx-arm64"]
version = "3.12.0"
description = "Hierarchical datasets for Python"

[tasks]

[dependencies]
python = ">=3.11"
numpy = ">=2"
numexpr = ">=2.6.2"
packaging = ">=26.3,<27"
py-cpuinfo = ">=9.0.0,<10"

[feature.build.dependencies]
hdf5 = "*"
c-blosc2 = ">=2.11"
bzip2 = "*"
lzo = "*"
snappy = "*"
blosc = ">=1.17"
lz4 = "*"
setuptools = ">=77.0"
packaging = "*"
py-cpuinfo = "*"
numpy = ">=2"
cython = ">=3.2"

[feature.dev.dependencies]
make = "*"
c-compiler = "*"
cxx-compiler = "*"
pkg-config = "*"
python-build = ">=1.6.1,<2"

[environments]
default = { solve-group = "production" }
dev = { features = ["build", "dev"], solve-group = "production" }
