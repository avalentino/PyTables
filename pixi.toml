[workspace]
authors = ["Antonio Valentino <antonio.valentino@tiscali.it>"]
channels = ["conda-forge"]
name = "PyTables"
platforms = ["linux-64", "osx-arm64"]
version = "3.12.0"
description = "Hierarchical datasets for Python"

[tasks]

[dependencies]
python = ">=3.11"
numpy = ">=2"
numexpr = ">=2.6.2"
packaging = "*"
py-cpuinfo = "*"

[feature.build.dependencies]
hdf5 = "*"
c-blosc2 = ">=2.11"
bzip2 = "*"
lzo = "*"
snappy = "*"
blosc = ">=1.17"
lz4 = "*"
setuptools = ">=77.0"
packaging = "*"
py-cpuinfo = "*"
numpy = ">=2"
cython = ">=3.2"

[feature.dev.dependencies]
c-compiler = "*"
cxx-compiler = "*"
pkg-config = "*"
python-build = "*"

[feature.test.dependencies]
pytest = "*"
pytest-doctestplus = "*"

[feature.docs.dependencies]
sphinx = ">=8"
sphinx_rtd_theme = "*"
ipython = "*"
sphinxcontrib-spelling = "*"

[environments]
default = { solve-group = "default" }

[environments.docs]
features = ["docs", "build", "dev"]
no-default-feature = true

[environments.docs.tasks]
html = "sphinx-build -M html doc/source doc/build"
linkcheck = "sphinx-build -M linkcheck doc/source doc/build"
docs-spellcheck = "sphinx-build -M spelling doc/source doc/build"
build-docs = { depends-on = ["html", "linkcheck"] }

[environments.docs.pypi-dependencies]
tables = { path = ".", editable = true }

[environments.dev]
features = ["build", "dev", "test"]
solve-group = "default"

[environments.dev.pypi-dependencies]
tables = { path = ".", editable = true }

[environments.dev.tasks]
doctests = "python3 -m pytest --doctest-only --pyargs tables -k 'not AttributeSet'"
unittests = "python3 -Werror -m tests"
tests = { depends-on = ["doctests", "unittests"] }

[environments.lint]
no-default-feature = true

[environments.lint.dependencies]
packaging = "*"
flake8 = "*"
pydocstyle = "*"
isort = "*"
black = "*"
ruff = "*"
codespell = "*"

[environments.lint.tasks]
check-requirements = "python3 ci/check_requirements_sync.py"
flake8 = "python3 -m flake8 --count --statistics tables tests"
pydocstyle = "python3 -m pydocstyle --count tables"
isort = "python3 -m isort --check tables tests"
black = "python3 -m black --check tables tests"
ruff = "ruff check tables tests"
codespell = "codespell"
lint = { depends-on = ["check-requirements", "flake8", "pydocstyle", "isort", "black", "ruff", "codespell"] }
